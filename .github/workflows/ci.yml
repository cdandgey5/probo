name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GRADLE_VERSION: 8.14.3
  GRADLE_SHA256: bd71102213493060956ec229d946beee57158dbd89d0e62b91bca0fa2c5f3531

jobs:
  test:
    name: lint, unit tests, Harbor contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-groups
      - run: uv run ruff format --check src tests scripts
      - run: uv run ruff check src tests scripts
      - run: uv run pytest
      - name: validate and convert the fixture task
        run: |
          uv run probo validate-task tasks/fixtures/pricing-discount
          uv run probo convert tasks/fixtures/pricing-discount -o build/harbor-tasks
      - name: Harbor loads the emitted task
        run: uv run python -c "from harbor.models.task.task import Task; t = Task('build/harbor-tasks/pricing-discount'); print(t.name, t.config.verifier.environment_mode)"
      - uses: actions/upload-artifact@v4
        with:
          name: emitted-task
          path: build/harbor-tasks

  grader:
    name: grader self-test and gate on the host JDK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: uv sync --all-groups
      - name: fetch the pinned Gradle distribution
        run: |
          curl -sSL -o /tmp/gradle.zip "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          echo "${GRADLE_SHA256} */tmp/gradle.zip" | sha256sum -c
          unzip -q /tmp/gradle.zip -d /tmp/gradle-dist
      - name: warm a Gradle home by building the fixture once
        working-directory: tasks/fixtures/pricing-discount/repo
        run: GRADLE_USER_HOME=/tmp/gradle-home "/tmp/gradle-dist/gradle-${GRADLE_VERSION}/bin/gradle" --no-daemon --console=plain --continue test
      - run: uv run probo convert tasks/fixtures/pricing-discount -o build/harbor-tasks
      - name: grader self-test (fourteen agent-behaviour scenarios)
        run: uv run probo grader-selftest build/harbor-tasks/pricing-discount --gradle-dist "/tmp/gradle-dist/gradle-${GRADLE_VERSION}" --warm-home /tmp/gradle-home --work /tmp/selftest --json /tmp/selftest.json
      - name: validation gate (states A, B, C)
        run: uv run probo gate build/harbor-tasks/pricing-discount --gradle-dist "/tmp/gradle-dist/gradle-${GRADLE_VERSION}" --warm-home /tmp/gradle-home --work /tmp/gate --runs 1 --json /tmp/gate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grader-results
          path: |
            /tmp/selftest.json
            /tmp/gate.json
