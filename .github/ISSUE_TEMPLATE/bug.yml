name: Bug report
description: Something graded wrong, crashed, or disagreed with a document
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the exit reason, verdict.json and the relevant gradle-test.log lines when the grader is involved.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: probo 0.1.0.dev0, harbor 0.24.0, Docker Desktop 4.x on Windows 11
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
