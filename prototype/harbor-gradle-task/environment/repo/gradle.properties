# Keep builds deterministic and self-contained for grading.
org.gradle.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=false
org.gradle.configuration-cache=false
# Never download a JDK at build time; the image pins the JDK.
org.gradle.java.installations.auto-download=false
# Compile Kotlin inside the Gradle JVM (no separate Kotlin daemon to size).
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx1g
